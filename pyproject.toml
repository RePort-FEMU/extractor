[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "femu-extractor"
version = "0.1.0"
description = "Firmware extraction tool using Rust binwalk bindings"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-magic>=0.4.27",
]

[tool.system-dependencies]
# libmagic1t64: python-magic. sleuthkit: provides tsk_recover, binwalk's EXT
# filesystem extractor. unrar: binwalk's RAR extractor
apt = ["libmagic1t64", "unrar", "sleuthkit"]

[tool.maturin]
module-name = "femu_extractor._lib"
python-source = "python"
features = ["pyo3/extension-module"]
